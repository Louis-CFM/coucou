<!doctype html><html><body style="margin:0;background:#1b1c1f">
<div id="sheet" style="display:inline-block;background:#0B0C0E;padding:12px"></div>
<script src="mochi-outfits.js"></script>
<script>
const outfits = (new URLSearchParams(location.search).get('o')||'none,beanie,santaHat,partyHat,crown,witchHat,sunglasses,roundGlasses,scarf,pumpkin,bow').split(',');
const cols = [
  {label:'L', yaw:-0.5, pitch:0, phys:{dx:0.6,dy:0}},
  {label:'front', yaw:0, pitch:0, phys:{dx:0,dy:0}},
  {label:'R', yaw:0.5, pitch:0, phys:{dx:-0.6,dy:0}},
  {label:'up', yaw:0.15, pitch:0.4, phys:{dx:0,dy:0.4}},
  {label:'down', yaw:-0.2, pitch:-0.5, phys:{dx:0,dy:-0.4}},
  {label:'tilt', yaw:0.3, pitch:-0.25, tilt:0.12, phys:{dx:-0.3,dy:0}},
];
const S = document.getElementById('sheet');
const W = 190, small = 64;
for (const o of outfits) {
  const row = document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:6px;margin:4px 0';
  const lab = document.createElement('div'); lab.textContent=o; lab.style.cssText='width:90px;color:#ddd;font:12px -apple-system,Helvetica;text-align:right';
  row.appendChild(lab);
  for (const c of cols) {
    const cv = document.createElement('canvas'); cv.width=W*2; cv.height=W*2; cv.style.width=W+'px'; cv.style.height=W+'px'; cv.style.background='#15171b'; cv.style.borderRadius='10px';
    const ctx = cv.getContext('2d'); ctx.scale(2,2);
    drawMochi(ctx, W, {...c, scale:0.62, outfit: o==='none'?null:o});
    row.appendChild(cv);
  }
  const cv = document.createElement('canvas'); cv.width=small*2; cv.height=small*2; cv.style.width=small+'px'; cv.style.height=small+'px'; cv.style.background='#000';
  const ctx = cv.getContext('2d'); ctx.scale(2,2); drawMochi(ctx, small, {scale:0.62, outfit:o==='none'?null:o});
  row.appendChild(cv);
  S.appendChild(row);
}
</script></body></html>
