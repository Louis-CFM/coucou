<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Coucou — Mémoire (prototype galaxie)</title>
<style>
  :root { --txt:#F2F3F5; --dim:#8E939C; --glass:rgba(16,17,20,.82); --line:rgba(255,255,255,.09); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#040405; color:var(--txt); font:13px -apple-system,"SF Pro Text",system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas.drag { cursor:grabbing; }
  .ui { position:fixed; z-index:5; }
  .pill { background:rgba(22,23,27,.72); border:1px solid var(--line); border-radius:999px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  #brand { left:22px; top:18px; }
  #brand b { display:block; font-size:14px; font-weight:650; letter-spacing:.1px; }
  #brand span { font-size:11.5px; color:var(--dim); }
  #back { left:18px; top:16px; padding:7px 14px; font-size:12.5px; display:none; }
  #home { left:50%; top:16px; transform:translateX(-50%); padding:7px 16px; font-size:12.5px; font-weight:600; }
  #pagesBtn { right:18px; top:16px; padding:7px 14px; font-size:12.5px; }
  #controls { left:50%; bottom:20px; transform:translateX(-50%); display:flex; gap:2px; padding:5px 8px; }
  #controls button { width:34px; height:30px; border-radius:8px; display:grid; place-items:center; color:#C9CDD3; }
  #controls button:hover { background:rgba(255,255,255,.08); color:#fff; }
  #controls svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #tip { position:fixed; z-index:4; pointer-events:none; padding:5px 10px; border-radius:7px; background:rgba(14,15,18,.86); border:1px solid var(--line); font-size:11.5px; font-weight:600; white-space:nowrap; transform:translate(-50%,-150%); display:none; }
  #panel { right:16px; top:62px; bottom:16px; width:360px; border-radius:16px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); display:none; flex-direction:column; overflow:hidden; }
  #panel header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 8px; font-size:12px; font-weight:650; color:#C9CDD3; }
  .x { width:24px; height:24px; border-radius:6px; color:var(--dim); font-size:16px; line-height:1; }
  .x:hover { background:rgba(255,255,255,.08); color:#fff; }
  .search { margin:0 14px 10px; display:flex; align-items:center; gap:8px; padding:0 11px; height:34px; border-radius:9px; background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--dim); }
  .search input { all:unset; flex:1; color:var(--txt); font-size:12.5px; }
  #chips { display:flex; flex-wrap:wrap; gap:5px; padding:0 14px 10px; }
  #chips button { font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:#C9CDD3; }
  #chips button.on { background:#F2F3F5; color:#0B0C0E; border-color:#F2F3F5; }
  #pbody { overflow:auto; padding:2px 16px 18px; flex:1; }
  .res { display:block; width:100%; text-align:left; padding:8px 10px; border-radius:8px; color:#DADDE2; font-size:12.5px; }
  .res:hover { background:rgba(255,255,255,.06); }
  .res small { display:block; color:var(--dim); font-size:11px; margin-top:2px; }
  .tag { display:inline-block; font-size:10px; font-weight:700; letter-spacing:1.1px; color:#C9CDD3; padding:3px 8px; border:1px solid var(--line); border-radius:6px; margin-top:6px; }
  #pbody h2 { margin:10px 0 4px; font-size:19px; line-height:1.25; font-weight:700; }
  .meta { color:var(--dim); font-size:11.5px; }
  .open { display:inline-block; margin:12px 0 4px; font-size:12px; color:#DADDE2; padding:6px 11px; border-radius:8px; border:1px solid var(--line); }
  .open:hover { background:rgba(255,255,255,.06); }
  #pbody p { color:#C3C7CE; font-size:12.5px; line-height:1.55; margin:10px 0; }
  #pbody h4 { margin:16px 0 6px; font-size:12.5px; }
  .link { color:#F2F3F5; text-decoration:underline; text-decoration-color:rgba(255,255,255,.35); cursor:pointer; }
  #dash { position:fixed; z-index:6; left:50%; top:58px; transform:translateX(-50%); width:min(1040px,calc(100vw - 40px)); max-height:calc(100vh - 120px); overflow:auto; border-radius:18px; background:rgba(13,14,17,.92); border:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); padding:20px 22px 22px; display:none; }
  #dash .top { display:flex; align-items:center; gap:10px; }
  #dash .top h3 { margin:0; font-size:20px; }
  #dash .top .date { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:2px 7px; }
  #dash .search { margin:14px 0 14px; height:40px; }
  .cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .card { border-radius:13px; background:rgba(255,255,255,.035); border:1px solid var(--line); padding:14px; position:relative; }
  .card .n { font-size:24px; font-weight:700; }
  .card .l { font-size:11.5px; color:#C9CDD3; margin-top:2px; }
  .card .s { font-size:10.5px; color:var(--dim); }
  .card .badge { position:absolute; right:12px; top:12px; font-size:10px; padding:2px 6px; border-radius:5px; border:1px solid; }
  .bars { display:flex; align-items:flex-end; gap:4px; height:30px; margin-top:12px; }
  .bars i { flex:1; border-radius:2px 2px 0 0; display:block; }
  .row3 { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:10px; margin-top:10px; }
  .box { border-radius:13px; background:rgba(255,255,255,.035); border:1px solid var(--line); padding:14px; }
  .box h5 { margin:0; font-size:12.5px; } .box .sub { font-size:10.5px; color:var(--dim); margin:2px 0 10px; }
  .hbar { display:block; width:100%; text-align:left; padding:5px 0; color:#DADDE2; font-size:12px; }
  .hbar span { float:right; color:var(--dim); }
  .hbar i { display:block; height:3px; border-radius:2px; margin-top:5px; }
  .hbar:hover { color:#fff; }
  .chart { display:flex; align-items:flex-end; gap:3px; height:120px; }

  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .lab { font-size:10.5px; letter-spacing:1.2px; color:var(--dim); font-weight:700; margin-bottom:8px; }
</style>

<body>
<canvas id="c" aria-label="Galaxie de la mémoire : toi au centre, tes projets et tes souvenirs autour"></canvas>

<div id="brand" class="ui"><b>Mémoire</b><span id="fps">— souvenirs · 60 i/s</span></div>
<button id="back" class="ui pill">← Toute la mémoire</button>

  <button id="zOut" aria-label="Dézoomer"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <button id="zIn" aria-label="Zoomer"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

</div>

<aside id="panel" class="ui">
  <header><span>Souvenirs</span><button class="x" id="pClose" aria-label="Fermer">×</button></header>
  <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-4-4"/></svg><input id="q" placeholder="Chercher un souvenir ou une conversation"></label>
  <div id="chips"></div>
  <div id="pbody"></div>
</aside>

<section id="dash" aria-label="Accueil de la mémoire"></section>

<script>
/* ================================================================
   Prototype de référence pour la page Graph de Coucou (Mémoire).
   Tout ce qui est marqué PORT doit être reproduit tel quel en Swift.
   ================================================================ */

// ---------- 1. Données (inventées ici ; dans Coucou : graph.json de brain) ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const gauss = () => Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(6.2832 * rnd());

const GROUPS = [
  ['Coucou', 330], ['Reels', 210], ['Botan', 110], ['Coucou Brain', 90], ['SBE Hub', 80],
  ['Freelance', 75], ['louisraille.fr', 60], ['Sponsos', 50], ['Templates Notion', 35], ['Korus', 25]
];
const TITLES = {
  'Coucou': ['Sortir la 0.6.2', 'La chambre de Mochi', 'Veto des permissions', 'Live Activity iPhone', 'Le hook qui ne bloque jamais', "What's new en 16 langues", 'Onglets du notch', 'Relais APNs', 'Lien Android', 'Notifications en double'],
  'Reels': ['Description du Reel de la chambre', 'Musique de fond', 'Hook en anglais', 'Écran de fin', 'Commentaire épinglé', 'SFX sur les transitions', 'Reel Coucou iPhone'],
  'Botan': ['Le nom du boîtier', 'Imprimer sur la A1 mini', 'Design system Botan', 'Page de lancement', 'Mochi sur l\'écran'],
  'Coucou Brain': ["Lire l'export claude.ai", 'Recherche en 3 secondes', 'Dédoublonner les souvenirs', 'La galaxie de la mémoire'],
  'SBE Hub': ['Template L3', 'Onboarding des étudiants', 'Bases Notion'],
  'Freelance': ['Landing pour un client', 'Devis à prix fixe', 'Appel découverte'],
  'louisraille.fr': ['Animation ScrollHero', 'Carrousels 3D', 'Masque du thème'],
  'Sponsos': ['Répondre à une marque', 'Tarif par Reel', 'Brief vidéo'],
  'Templates Notion': ['Planner hebdo', 'Cockpit scolaire'],
  'Korus': ['Factures conformes 2026', 'Relances automatiques']
};
const KINDS = { conv: 'Conversation', decision: 'Décision', lecon: 'Leçon', fait: 'Fait', pref: 'Préférence', personne: 'Personne' };
const ELTXT = {
  decision: ['On garde le bundle id tel quel.', 'La mémoire reste en local, sans remote.', 'Une commande Terminal par bloc.', 'Pas de lien dans la description Insta.'],
  lecon: ['git stash avant de changer de branche.', 'Vérifier la place disque avant un build.', 'Ne jamais bloquer Claude Code.'],
  fait: ['La 0.6.2 est sur Homebrew.', 'La recherche tient en 3 secondes.', 'Le relais est déployé sur Cloudflare.'],
  pref: ['Réponses courtes, en français.', "Changer de style d'un Reel à l'autre.", "Le rouge n'est pas la couleur d'accent."]
};

const nodes = [], edges = [], groups = [];
const addEdge = (a, b) => { if (a === b) return; edges.push([a, b]); nodes[a].adj.push(b); nodes[b].adj.push(a); };

// PORT — placement : un seul nuage sphérique autour du trou noir. Chaque groupe (projet) = un amas
// dont le rayon ∝ √(nombre de points) ; les centres des amas sont répartis sur une sphère (spirale de
// Fibonacci), à une distance qui grandit avec la taille de l'amas. Les amas se touchent sans se confondre.
const N_TOTAL = GROUPS.reduce((s, g) => s + g[1], 0);
GROUPS.forEach(([name, count], gi) => {
  const r = 12 * Math.sqrt(count);
  const k = gi + 0.5, phi = Math.acos(1 - 2 * k / GROUPS.length), th = 2.39996 * gi;
  const dist = 120 + r * 0.75;
  const g = { name, count, r,
    cx: dist * Math.sin(phi) * Math.cos(th), cy: dist * Math.cos(phi) * 0.8, cz: dist * Math.sin(phi) * Math.sin(th), ids: [] };
  groups.push(g);
});

const today = Date.now();
groups.forEach((g, gi) => {
  const nConv = Math.round(g.count * 0.55);
  const convIds = [];
  for (let i = 0; i < g.count; i++) {
    const isConv = i < nConv;
    let kind = 'conv';
    if (!isConv) kind = ['decision', 'decision', 'lecon', 'fait', 'fait', 'pref'][Math.floor(rnd() * 6)];
    let x, y, z, parent = -1;
    if (isConv) {
      // point uniforme dans une sphère (aplatie en hauteur)
      let u, v, w; do { u = rnd() * 2 - 1; v = rnd() * 2 - 1; w = rnd() * 2 - 1; } while (u * u + v * v + w * w > 1);
      x = g.cx + u * g.r; y = g.cy + v * g.r * 0.85; z = g.cz + w * g.r;
    } else {
      parent = convIds[Math.floor(rnd() * convIds.length)];
      const p = nodes[parent];
      x = p.x + gauss() * 9; y = p.y + gauss() * 6; z = p.z + gauss() * 9;
    }
    const age = Math.floor(rnd() * rnd() * 400);
    const id = nodes.length;
    const t = TITLES[g.name];
    nodes.push({ id, kind, g: gi, x, y, z, adj: [], age, parent,
      label: kind === 'conv' ? t[i % t.length] + (i >= t.length ? ' (' + (Math.floor(i / t.length) + 1) + ')' : '') : ELTXT[kind][i % ELTXT[kind].length],
      src: rnd() < 0.7 ? 'claude.ai' : 'Claude Code' });
    g.ids.push(id);
    if (isConv) convIds.push(id); else addEdge(id, parent);
  }
});
// quelques personnes
[['Ohualtex', 0], ['Rhytam', 0], ['Eduardo', 0], ['Enya', 4]].forEach(([name, gi]) => {
  const g = groups[gi], id = nodes.length;
  nodes.push({ id, kind: 'personne', g: gi, x: g.cx + gauss() * g.r * 0.5, y: g.cy + gauss() * 20, z: g.cz + gauss() * g.r * 0.5, adj: [], age: 3, parent: -1, label: name, src: '' });
  g.ids.push(id);
});

// PORT — espacement : relaxation par collision dans chaque amas (distance mini 8),
// pour qu'aucun point n'en recouvre un autre. Fait une fois, dans brain (graph.json).
const MIN_D = 8;
groups.forEach(g => {
  const ids = g.ids;
  for (let it = 0; it < 24; it++) {
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const a = nodes[ids[i]], b = nodes[ids[j]];
      let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z, d = Math.hypot(dx, dy, dz) || 0.01;
      if (d < MIN_D) { const k = (MIN_D - d) / d * 0.5; dx *= k; dy *= k; dz *= k; a.x -= dx; a.y -= dy; a.z -= dz; b.x += dx; b.y += dy; b.z += dz; }
    }
  }
});
// PORT — liens : chaque conversation → ses 2 voisines les plus proches du même amas ;
// (3 voisines) ; éléments → leur conversation ; personnes → 8 conversations de leur projet ; 3 % de ponts entre amas.
groups.forEach(g => {
  const convs = g.ids.filter(i => nodes[i].kind === 'conv');
  convs.forEach(i => {
    const a = nodes[i];
    const near = convs.filter(j => j !== i).map(j => [j, (nodes[j].x - a.x) ** 2 + (nodes[j].y - a.y) ** 2 + (nodes[j].z - a.z) ** 2]).sort((p, q) => p[1] - q[1]);
    for (let k = 0; k < 3 && k < near.length; k++) if (!a.adj.includes(near[k][0])) addEdge(i, near[k][0]);
    if (rnd() < 0.03) { const og = groups[Math.floor(rnd() * groups.length)]; const t = og.ids[Math.floor(rnd() * og.ids.length)]; if (nodes[t].kind === 'conv') addEdge(i, t); }
  });
  g.ids.filter(i => nodes[i].kind === 'personne').forEach(p => { for (let k = 0; k < 8; k++) addEdge(p, convs[Math.floor(rnd() * convs.length)]); });
});
// centroïde réel de chaque amas (après relaxation) pour placer son nom
groups.forEach(g => { let x = 0, y = 0, z = 0; g.ids.forEach(i => { x += nodes[i].x; y += nodes[i].y; z += nodes[i].z; }); g.cx = x / g.ids.length; g.cy = y / g.ids.length; g.cz = z / g.ids.length; });
const MAX_AGE = 400;

// ---------- 2. Caméra ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const cam = { yaw: 0.5, pitch: -0.18, zoom: 1, tx: 0, ty: 0, tz: 0 };
let fly = null, paused = false, grow = 1, sel = -1, hover = -1, inGroup = -1;

function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth * DPR; H = cv.clientHeight * DPR; cv.width = W; cv.height = H; buildNebula(); }
addEventListener('resize', resize);

// PORT — projection : rotation (yaw puis pitch) autour de la cible, perspective F=1400, échelle = zoom × min(W,H)/820.
const F = 1400;
const P = new Float32Array(nodes.length * 3); // x, y écran ; f (profondeur)
const PZ = new Float32Array(nodes.length);     // profondeur caméra
let holeZ = 0;
function project(x, y, z, out) {
  x -= cam.tx; y -= cam.ty; z -= cam.tz;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
  const y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
  const f = F / (F + z2), s = cam.zoom * Math.min(W, H) / 820;
  out[0] = W / 2 + x1 * f * s; out[1] = H / 2 + y1 * f * s; out[2] = f; out[3] = z2;
  return out;
}
const tmp = [0, 0, 0, 0];
function scale() { return cam.zoom * Math.min(W, H) / 820; }

// ---------- 3. Fond : nébuleuse grise (bruit fractal précalculé) + étoiles ----------
let neb = null;
function buildNebula() {
  const S = 384, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S);
  const grid = (n) => { const a = []; for (let i = 0; i < (n + 1) * (n + 1); i++) a.push(Math.random()); return a; };
  const octs = [[6, 0.5], [12, 0.25], [24, 0.15], [48, 0.1]].map(([n, w]) => ({ n, w, v: grid(n) }));
  const sm = t => t * t * (3 - 2 * t);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let v = 0;
    for (const o of octs) {
      const fx = x / S * o.n, fy = y / S * o.n, ix = Math.floor(fx), iy = Math.floor(fy), ux = sm(fx - ix), uy = sm(fy - iy), r = o.n + 1;
      const a = o.v[iy * r + ix], b = o.v[iy * r + ix + 1], cc = o.v[(iy + 1) * r + ix], d = o.v[(iy + 1) * r + ix + 1];
      v += o.w * (a + (b - a) * ux + (cc - a) * uy + (a - b - cc + d) * ux * uy);
    }
    const al = Math.max(0, v - 0.48) * 2.2;
    const k = (y * S + x) * 4; img.data[k] = 150; img.data[k + 1] = 152; img.data[k + 2] = 158; img.data[k + 3] = Math.min(255, al * 120);
  }
  g.putImageData(img, 0, 0); neb = c;
}
const stars = Array.from({ length: 420 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 0.9 + 0.2, a: Math.random() * 0.5 + 0.15 }));

// ---------- 4. Trou noir (toi) : disque d'accrétion façon Interstellar ----------
const dust = Array.from({ length: 520 }, () => ({ r: 1.5 + Math.pow(Math.random(), 1.6) * 3.2, a: Math.random() * 6.283, s: 0.6 + Math.random() * 0.8 }));
function drawBlackHole(t) {
  project(0, 0, 0, tmp);
  const bx = tmp[0], by = tmp[1], R = 34 * tmp[2] * scale(); // rayon de l'horizon
  const flat = 0.16;                                                        // disque vu presque par la tranche
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  // halo doré
  let g = ctx.createRadialGradient(bx, by, R * 0.8, bx, by, R * 6);
  g.addColorStop(0, 'rgba(255,190,120,0.35)'); g.addColorStop(0.35, 'rgba(255,150,80,0.08)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(bx - R * 6, by - R * 6, R * 12, R * 12);
  // poussière en orbite (moitié arrière)
  drawDust(bx, by, R, flat, t, true);
  // moitié arrière du disque (au-dessus du trou)
  drawDisk(bx, by, R, flat, true);
  ctx.restore();
  // horizon : disque noir
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(bx, by, R, 0, 6.283); ctx.fill();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // anneau de photons + image lentillée du disque (anneau autour de l'horizon)
  for (const [rr, w, a] of [[1.05, 0.06, 0.95], [1.18, 0.16, 0.55], [1.34, 0.22, 0.22]]) {
    ctx.lineWidth = R * w;
    const rg = ctx.createLinearGradient(bx - R * 1.4, by, bx + R * 1.4, by);
    rg.addColorStop(0, `rgba(255,236,205,${a})`); rg.addColorStop(1, `rgba(255,170,95,${a * 0.6})`);
    ctx.strokeStyle = rg; ctx.beginPath(); ctx.arc(bx, by, R * rr, 0, 6.283); ctx.stroke();
  }
  // moitié avant du disque (passe devant le trou)
  drawDisk(bx, by, R, flat, false);
  drawDust(bx, by, R, flat, t, false);
  ctx.restore();
  return { bx, by, R };
}

  dash.innerHTML = `
    <div class="top"><h3>Accueil</h3><span class="date">${fmt(0)}</span><span style="flex:1"></span><button class="x" id="dClose" aria-label="Fermer">×</button></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-4-4"/></svg><input id="dq" placeholder="Chercher dans toutes tes conversations et souvenirs…"></label>
    <div class="cards">
      ${card(convs.length, 'Conversations', 'claude.ai et Claude Code', '#FB923C', hist(convs, 8, 50), '+' + convs.filter(n => n.age < 7).length + ' cette semaine')}
      ${card(els.length, 'Souvenirs', 'décisions, leçons, faits, préférences', '#34D399', hist(els, 8, 50), (els.length / convs.length).toFixed(1) + ' / conv.')}
      ${card(edges.length, 'Liens', 'entre conversations et souvenirs', '#60A5FA', hist(convs, 8, 50).map(v => v * 3), (edges.length / nodes.length).toFixed(1) + ' / point')}
      ${card(week, 'Cette semaine', 'nouveaux ces 7 derniers jours', '#A78BFA', hist(nodes.filter(n => n.age < 56), 8, 7), Math.round(week / nodes.length * 100) + ' %')}
    </div>
    <div class="row3">
      <div class="box"><h5>Activité</h5><div class="sub">Par jour, 30 derniers jours</div><div class="chart">${days.map(v => `<i style="height:${v / Math.max(...days, 1) * 100}%"></i>`).join('')}</div></div>
      <div class="box"><h5>Souvenirs par projet</h5><div class="sub">Clique pour y aller</div>${byG.slice(0, 7).map(([g, gi]) => `<button class="hbar" data-g="${gi}">${g.name}<span>${g.ids.length}</span><i style="width:${g.ids.length / maxG * 100}%;background:#34D399"></i></button>`).join('')}</div>
      <div class="box"><h5>Les plus reliées</h5><div class="sub">Conversations avec le plus de liens</div>${top.map(n => `<button class="hbar" data-n="${n.id}"></button>`).join('')}</div>
    </div>
    <div class="row2">
      <div class="box"><div class="lab">ACTIVITÉ RÉCENTE</div>${recent.map(n => `<button class="res" data-n="${n.id}"></button>`).join('')}</div>
      <div class="box"><div class="lab">DERNIERS SOUVENIRS RETENUS</div>${[...els].sort((a, b) => a.age - b.age).slice(0, 4).map(n => `<button class="res" data-n="${n.id}"></button>`).join('')}</div>
    </div>`;
  dash.querySelectorAll('[data-n]').forEach(el => { const n = nodes[+el.dataset.n]; el.textContent = n.label;
    const s = document.createElement(el.classList.contains('hbar') ? 'span' : 'small'); s.textContent = el.classList.contains('hbar') ? n.adj.length : `${KINDS[n.kind]} · ${groups[n.g].name} · ${fmt(n.age)}`; el.appendChild(s);
    if (el.classList.contains('hbar')) { const i = document.createElement('i'); i.style.cssText = `width:${n.adj.length / top[0].adj.length * 100}%;background:#60A5FA`; el.appendChild(i); }
    el.onclick = () => { dash.style.display = 'none'; flyTo(n.x, n.y, n.z, 5); select(n.id); }; });
  dash.querySelectorAll('[data-g]').forEach(el => el.onclick = () => { dash.style.display = 'none'; enterGroup(+el.dataset.g); });
  dash.querySelector('#dClose').onclick = () => dash.style.display = 'none';
  dash.querySelector('#dq').oninput = e => { dash.style.display = 'none'; filter.q = e.target.value; panelMode = 'list'; openPanel(); document.getElementById('q').value = e.target.value; renderList(); document.getElementById('q').focus(); };
  dash.style.display = 'block';
}
document.getElementById('home').onclick = () => dash.style.display === 'block' ? dash.style.display = 'none' : openDash();

// ---------- 10. Contrôles ----------
document.getElementById('zIn').onclick = () => zoomAt(W / 2, H / 2, 1.5);
document.getElementById('zOut').onclick = () => zoomAt(W / 2, H / 2, 1 / 1.5);
document.getElementById('reset').onclick = () => leaveGroup();
document.getElementById('grow').onclick = () => { leaveGroup(); grow = 0; };
document.getElementById('pause').onclick = () => paused = !paused;
document.getElementById('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
document.getElementById('back').onclick = () => leaveGroup();

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
