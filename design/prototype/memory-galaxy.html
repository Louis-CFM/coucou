<!DOCTYPE html>
<html lang="fr">
<head>

<style>
  :root { --txt:#F2F3F5; --dim:#8E939C; --glass:rgba(16,17,20,.82); --line:rgba(255,255,255,.09); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#040405; color:var(--txt); font:13px -apple-system,"SF Pro Text",system-ui,sans-serif; overflow:hidden; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  canvas.drag { cursor:grabbing; }
  .ui { position:fixed; z-index:5; }
  .pill { background:rgba(22,23,27,.72); border:1px solid var(--line); border-radius:999px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  #brand { left:22px; top:18px; }
  #brand b { display:block; font-size:14px; font-weight:650; letter-spacing:.1px; }
  #brand span { font-size:11.5px; color:var(--dim); }
  #back { left:18px; top:16px; padding:7px 14px; font-size:12.5px; display:none; }
  #home { left:50%; top:16px; transform:translateX(-50%); padding:7px 16px; font-size:12.5px; font-weight:600; }
  #pagesBtn { right:18px; top:16px; padding:7px 14px; font-size:12.5px; }
  #controls { left:50%; bottom:20px; transform:translateX(-50%); display:flex; gap:2px; padding:5px 8px; }
  #controls button { width:34px; height:30px; border-radius:8px; display:grid; place-items:center; color:#C9CDD3; }
  #controls button:hover { background:rgba(255,255,255,.08); color:#fff; }
  #controls svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  #tip { position:fixed; z-index:4; pointer-events:none; padding:5px 10px; border-radius:7px; background:rgba(14,15,18,.86); border:1px solid var(--line); font-size:11.5px; font-weight:600; white-space:nowrap; transform:translate(-50%,-150%); display:none; }
  #panel { right:16px; top:62px; bottom:16px; width:360px; border-radius:16px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); display:none; flex-direction:column; overflow:hidden; }
  #panel header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 8px; font-size:12px; font-weight:650; color:#C9CDD3; }
  .x { width:24px; height:24px; border-radius:6px; color:var(--dim); font-size:16px; line-height:1; }
  .x:hover { background:rgba(255,255,255,.08); color:#fff; }
  .search { margin:0 14px 10px; display:flex; align-items:center; gap:8px; padding:0 11px; height:34px; border-radius:9px; background:rgba(255,255,255,.05); border:1px solid var(--line); color:var(--dim); }
  .search input { all:unset; flex:1; color:var(--txt); font-size:12.5px; }
  #chips { display:flex; flex-wrap:wrap; gap:5px; padding:0 14px 10px; }
  #chips button { font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:#C9CDD3; }
  #chips button.on { background:#F2F3F5; color:#0B0C0E; border-color:#F2F3F5; }
  #pbody { overflow:auto; padding:2px 16px 18px; flex:1; }
  .res { display:block; width:100%; text-align:left; padding:8px 10px; border-radius:8px; color:#DADDE2; font-size:12.5px; }
  .res:hover { background:rgba(255,255,255,.06); }
  .res small { display:block; color:var(--dim); font-size:11px; margin-top:2px; }
  .tag { display:inline-block; font-size:10px; font-weight:700; letter-spacing:1.1px; color:#C9CDD3; padding:3px 8px; border:1px solid var(--line); border-radius:6px; margin-top:6px; }
  #pbody h2 { margin:10px 0 4px; font-size:19px; line-height:1.25; font-weight:700; }
  .meta { color:var(--dim); font-size:11.5px; }
  .open { display:inline-block; margin:12px 0 4px; font-size:12px; color:#DADDE2; padding:6px 11px; border-radius:8px; border:1px solid var(--line); }
  .open:hover { background:rgba(255,255,255,.06); }
  #pbody p { color:#C3C7CE; font-size:12.5px; line-height:1.55; margin:10px 0; }
  #pbody h4 { margin:16px 0 6px; font-size:12.5px; }
  .link { color:#F2F3F5; text-decoration:underline; text-decoration-color:rgba(255,255,255,.35); cursor:pointer; }
  #dash { position:fixed; z-index:6; left:50%; top:58px; transform:translateX(-50%); width:min(1040px,calc(100vw - 40px)); max-height:calc(100vh - 120px); overflow:auto; border-radius:18px; background:rgba(13,14,17,.92); border:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); padding:20px 22px 22px; display:none; }
  #dash .top { display:flex; align-items:center; gap:10px; }
  #dash .top h3 { margin:0; font-size:20px; }
  #dash .top .date { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:6px; padding:2px 7px; }
  #dash .search { margin:14px 0 14px; height:40px; }
  .cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
  .card { border-radius:13px; background:rgba(255,255,255,.035); border:1px solid var(--line); padding:14px; position:relative; }
  .card .n { font-size:24px; font-weight:700; }
  .card .l { font-size:11.5px; color:#C9CDD3; margin-top:2px; }
  .card .s { font-size:10.5px; color:var(--dim); }
  .card .badge { position:absolute; right:12px; top:12px; font-size:10px; padding:2px 6px; border-radius:5px; border:1px solid; }
  .bars { display:flex; align-items:flex-end; gap:4px; height:30px; margin-top:12px; }
  .bars i { flex:1; border-radius:2px 2px 0 0; display:block; }
  .row3 { display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:10px; margin-top:10px; }
  .box { border-radius:13px; background:rgba(255,255,255,.035); border:1px solid var(--line); padding:14px; }
  .box h5 { margin:0; font-size:12.5px; } .box .sub { font-size:10.5px; color:var(--dim); margin:2px 0 10px; }
  .hbar { display:block; width:100%; text-align:left; padding:5px 0; color:#DADDE2; font-size:12px; }

  .hbar i { display:block; height:3px; border-radius:2px; margin-top:5px; }

  .lab { font-size:10.5px; letter-spacing:1.2px; color:var(--dim); font-weight:700; margin-bottom:8px; }
</style>

<body>
<canvas id="c" aria-label="Galaxie de la mémoire : toi au centre, tes projets et tes souvenirs autour"></canvas>

<div id="brand" class="ui"><b>Mémoire</b><span id="fps">— souvenirs · 60 i/s</span></div>
<button id="back" class="ui pill">← Toute la mémoire</button>

<div id="controls" class="ui pill">
  <button id="zOut" aria-label="Dézoomer"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>

  <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-4-4"/></svg><input id="q" placeholder="Chercher un souvenir ou une conversation"></label>
  <div id="chips"></div>
  <div id="pbody"></div>

<section id="dash" aria-label="Accueil de la mémoire"></section>

<script>
/* ================================================================
   Prototype de référence pour la page Graph de Coucou (Mémoire).
   Tout ce qui est marqué PORT doit être reproduit tel quel en Swift.
   ================================================================ */

// ---------- 1. Données (inventées ici ; dans Coucou : graph.json de brain) ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const gauss = () => Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(6.2832 * rnd());

const GROUPS = [
  ['Coucou', 330], ['Reels', 210], ['Botan', 110], ['Coucou Brain', 90], ['SBE Hub', 80],
  ['Freelance', 75], ['louisraille.fr', 60], ['Sponsos', 50], ['Templates Notion', 35], ['Korus', 25]
];
const TITLES = {
  'Coucou': ['Sortir la 0.6.2', 'La chambre de Mochi', 'Veto des permissions', 'Live Activity iPhone', 'Le hook qui ne bloque jamais', "What's new en 16 langues", 'Onglets du notch', 'Relais APNs', 'Lien Android', 'Notifications en double'],
  'Reels': ['Description du Reel de la chambre', 'Musique de fond', 'Hook en anglais', 'Écran de fin', 'Commentaire épinglé', 'SFX sur les transitions', 'Reel Coucou iPhone'],
  'Botan': ['Le nom du boîtier', 'Imprimer sur la A1 mini', 'Design system Botan', 'Page de lancement', 'Mochi sur l\'écran'],
  'Coucou Brain': ["Lire l'export claude.ai", 'Recherche en 3 secondes', 'Dédoublonner les souvenirs', 'La galaxie de la mémoire'],
  'SBE Hub': ['Template L3', 'Onboarding des étudiants', 'Bases Notion'],
  'Freelance': ['Landing pour un client', 'Devis à prix fixe', 'Appel découverte'],
  'louisraille.fr': ['Animation ScrollHero', 'Carrousels 3D', 'Masque du thème'],
  'Sponsos': ['Répondre à une marque', 'Tarif par Reel', 'Brief vidéo'],
  'Templates Notion': ['Planner hebdo', 'Cockpit scolaire'],
  'Korus': ['Factures conformes 2026', 'Relances automatiques']
};
const KINDS = { conv: 'Conversation', decision: 'Décision', lecon: 'Leçon', fait: 'Fait', pref: 'Préférence', personne: 'Personne' };
const ELTXT = {
  decision: ['On garde le bundle id tel quel.', 'La mémoire reste en local, sans remote.', 'Une commande Terminal par bloc.', 'Pas de lien dans la description Insta.'],
  lecon: ['git stash avant de changer de branche.', 'Vérifier la place disque avant un build.', 'Ne jamais bloquer Claude Code.'],
  fait: ['La 0.6.2 est sur Homebrew.', 'La recherche tient en 3 secondes.', 'Le relais est déployé sur Cloudflare.'],
  pref: ['Réponses courtes, en français.', "Changer de style d'un Reel à l'autre.", "Le rouge n'est pas la couleur d'accent."]
};

const nodes = [], edges = [], groups = [];
const addEdge = (a, b) => { if (a === b) return; edges.push([a, b]); nodes[a].adj.push(b); nodes[b].adj.push(a); };

// PORT — placement : TOUT EST À PLAT (2D), autour du trou noir, jamais devant ni derrière.
// Les souvenirs forment un anneau plein autour du trou noir (de HOLE_CLEAR à R_OUT). Chaque groupe
// (projet) en occupe un secteur dont l'angle est proportionnel à son nombre de points ; R_OUT grandit
// avec le nombre total de points (≈ 22 unités² par point), donc la densité reste la même.
const HOLE_CLEAR = 190;
const N_ALL = GROUPS.reduce((s, g) => s + g[1], 0);
const R_OUT = Math.sqrt(HOLE_CLEAR ** 2 + N_ALL * 22 * 22 / Math.PI);
const GAP = 0.025;                                         // petit espace entre deux secteurs
let acc = -Math.PI / 2;
GROUPS.forEach(([name, count]) => {
  const span = (2 * Math.PI - GAP * GROUPS.length) * count / N_ALL;
  const a0 = acc, a1 = acc + span; acc = a1 + GAP;
  const am = (a0 + a1) / 2, rm = (HOLE_CLEAR + R_OUT) / 2;
  groups.push({ name, count, a0, a1, r: Math.sqrt(count) * 12, cx: Math.cos(am) * rm, cy: Math.sin(am) * rm, ids: [] });
});

const today = Date.now();
groups.forEach((g, gi) => {
  const nConv = Math.round(g.count * 0.55);
  const convIds = [];
  for (let i = 0; i < g.count; i++) {
    const isConv = i < nConv;
    let kind = 'conv';
    if (!isConv) kind = ['decision', 'decision', 'lecon', 'fait', 'fait', 'pref'][Math.floor(rnd() * 6)];
    let x, y, parent = -1;
    if (isConv) { const rho = Math.sqrt(HOLE_CLEAR ** 2 + rnd() * (R_OUT ** 2 - HOLE_CLEAR ** 2)), th = g.a0 + rnd() * (g.a1 - g.a0); x = Math.cos(th) * rho; y = Math.sin(th) * rho; }
    else { parent = convIds[Math.floor(rnd() * convIds.length)]; x = nodes[parent].x + gauss() * 9; y = nodes[parent].y + gauss() * 9; }
    const age = Math.floor(rnd() * rnd() * 400);
    const id = nodes.length, t = TITLES[g.name];
    nodes.push({ id, kind, g: gi, x, y, adj: [], age, parent, ph: rnd() * 6.283,
      label: kind === 'conv' ? t[i % t.length] + (i >= t.length ? ' (' + (Math.floor(i / t.length) + 1) + ')' : '') : ELTXT[kind][i % ELTXT[kind].length],
      src: rnd() < 0.7 ? 'claude.ai' : 'Claude Code' });
    g.ids.push(id);
    if (isConv) convIds.push(id); else addEdge(id, parent);
  }
});
[['Ohualtex', 0], ['Rhytam', 0], ['Eduardo', 0], ['Enya', 4]].forEach(([name, gi]) => {
  const g = groups[gi], id = nodes.length;
  nodes.push({ id, kind: 'personne', g: gi, x: g.cx + gauss() * g.r * 0.4, y: g.cy + gauss() * g.r * 0.4, adj: [], age: 3, parent: -1, ph: rnd() * 6.283, label: name, src: '' });
  g.ids.push(id);
});

// PORT — espacement : relaxation par collision dans chaque amas (distance mini 10, 24 passes),
// et personne à moins de HOLE_CLEAR du centre. Fait une fois, dans brain (graph.json).
const MIN_D = 10;
groups.forEach(g => {
  const ids = g.ids;
  for (let it = 0; it < 24; it++) {
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
      const a = nodes[ids[i]], b = nodes[ids[j]];
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
      if (d < MIN_D) { const k = (MIN_D - d) / d * 0.5; dx *= k; dy *= k; a.x -= dx; a.y -= dy; b.x += dx; b.y += dy; }
    }
    for (const i of ids) { const n = nodes[i], d = Math.hypot(n.x, n.y); if (d < HOLE_CLEAR) { n.x *= HOLE_CLEAR / d; n.y *= HOLE_CLEAR / d; } }
  }
});
// PORT — liens : chaque conversation → ses 3 voisines les plus proches de son amas ; éléments → leur
// conversation ; personnes → 8 conversations de leur projet ; 3 % de ponts entre amas.
groups.forEach(g => {
  const convs = g.ids.filter(i => nodes[i].kind === 'conv');
  convs.forEach(i => {
    const a = nodes[i];
    const near = convs.filter(j => j !== i).map(j => [j, (nodes[j].x - a.x) ** 2 + (nodes[j].y - a.y) ** 2]).sort((p, q) => p[1] - q[1]);
    for (let k = 0; k < 3 && k < near.length; k++) if (!a.adj.includes(near[k][0])) addEdge(i, near[k][0]);
    if (rnd() < 0.015) { const og = groups[Math.floor(rnd() * groups.length)]; const t = og.ids[Math.floor(rnd() * og.ids.length)]; if (nodes[t].kind === 'conv') addEdge(i, t); }
  });
  g.ids.filter(i => nodes[i].kind === 'personne').forEach(p => { for (let k = 0; k < 8; k++) addEdge(p, convs[Math.floor(rnd() * convs.length)]); });
});
groups.forEach(g => { let x = 0, y = 0; g.ids.forEach(i => { x += nodes[i].x; y += nodes[i].y; }); g.cx = x / g.ids.length; g.cy = y / g.ids.length; });
const nodeEdges = nodes.map(() => []); edges.forEach(([a, b], k) => { nodeEdges[a].push(k); nodeEdges[b].push(k); });
const MAX_AGE = 400;

// ---------- 2. Caméra (vue de dessus, à plat) ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
// PORT — caméra 2D : la mémoire tourne très lentement autour du trou noir (rot), on se déplace (tx, ty)
// et on zoome (0,35 → 40). Pas d'inclinaison, pas de 3D.
const cam = { rot: 0, zoom: 1, tx: 0, ty: 0 };
let fly = null, paused = false, grow = 1, sel = -1, hover = -1, inGroup = -1;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth * DPR; H = cv.clientHeight * DPR; cv.width = W; cv.height = H; buildNebula(); }
addEventListener('resize', resize);
const P = new Float32Array(nodes.length * 2);
const tmp = [0, 0];
function scale() { return cam.zoom * Math.min(W, H) / (2 * R_OUT + 260); }
function rot(x, y) { const c = Math.cos(cam.rot), s = Math.sin(cam.rot); return [x * c - y * s, x * s + y * c]; }
function project(x, y, out) { const r = rot(x, y), k = scale(); out[0] = W / 2 + (r[0] - cam.tx) * k; out[1] = H / 2 + (r[1] - cam.ty) * k; return out; }

// ---------- 3. Fond : nébuleuse grise (bruit fractal précalculé) + étoiles ----------
let neb = null;
function buildNebula() {
  const S = 384, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S);
  const grid = (n) => { const a = []; for (let i = 0; i < (n + 1) * (n + 1); i++) a.push(Math.random()); return a; };
  const octs = [[6, 0.5], [12, 0.25], [24, 0.15], [48, 0.1]].map(([n, w]) => ({ n, w, v: grid(n) }));
  const sm = t => t * t * (3 - 2 * t);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    let v = 0;
    for (const o of octs) {
      const fx = x / S * o.n, fy = y / S * o.n, ix = Math.floor(fx), iy = Math.floor(fy), ux = sm(fx - ix), uy = sm(fy - iy), r = o.n + 1;
      const a = o.v[iy * r + ix], b = o.v[iy * r + ix + 1], cc = o.v[(iy + 1) * r + ix], d = o.v[(iy + 1) * r + ix + 1];
      v += o.w * (a + (b - a) * ux + (cc - a) * uy + (a - b - cc + d) * ux * uy);
    }
    const al = Math.max(0, v - 0.48) * 2.2;
    const k = (y * S + x) * 4; img.data[k] = 150; img.data[k + 1] = 152; img.data[k + 2] = 158; img.data[k + 3] = Math.min(255, al * 120);
  }
  g.putImageData(img, 0, 0); neb = c;
}
const stars = Array.from({ length: 420 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 0.9 + 0.2, a: Math.random() * 0.5 + 0.15 }));

// ---------- 4. Trou noir (toi), d'après la référence : Gargantua ----------
// PORT — anneaux lentillés faits de nombreux arcs fins qui tournent, côté gauche plus brillant
// (Doppler), horizon presque noir, fin anneau pointillé intérieur, longue bande d'accrétion
// horizontale qui passe DEVANT, éclat à gauche, poussière dorée en orbite.
const dust = Array.from({ length: 700 }, () => ({ r: 1.55 + Math.pow(Math.random(), 1.4) * 1.9, a: Math.random() * 6.283, s: 0.5 + Math.random(), z: Math.random() }));
const arcs = Array.from({ length: 22 }, (_, k) => ({ r: 1.04 + Math.random() * 0.55, a0: Math.random() * 6.283, len: 1.4 + Math.random() * 3.6,
  w: 0.5 + Math.random() * 1.3, sp: (0.00012 + Math.random() * 0.00025) * (Math.random() < 0.85 ? 1 : -1), al: 0.25 + Math.random() * 0.55 }));
const BH_R = 64;
function drawBlackHole(t) {
  project(0, 0, tmp);
  const bx = tmp[0], by = tmp[1], R = BH_R * scale();
  const warm = (a, k = 0) => `rgba(255,${226 - k * 60 | 0},${186 - k * 110 | 0},${a})`;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  // halo
  let g = ctx.createRadialGradient(bx, by, R * 0.9, bx, by, R * 4.6);
  g.addColorStop(0, 'rgba(255,176,102,0.20)'); g.addColorStop(0.4, 'rgba(255,140,70,0.05)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(bx - R * 5, by - R * 5, R * 10, R * 10);
  // poussière en orbite (disque vu de dessus)
  for (const d of dust) {
    const a = d.a + t * 0.0009 * d.s / Math.pow(d.r, 1.5);
    const x = bx + Math.cos(a) * d.r * R, y = by + Math.sin(a) * d.r * R;
    const al = (1 - (d.r - 1.55) / 1.9) * (0.25 + d.z * 0.45);
    ctx.fillStyle = warm(al, d.z); ctx.fillRect(x, y, 1.1 * DPR, 1.1 * DPR);
  }
  // anneaux lentillés : arcs fins qui tournent ; luminosité selon l'angle (gauche = plus brillant)
  for (const c of arcs) {
    const a0 = c.a0 + t * c.sp, seg = 10;
    ctx.lineWidth = c.w * DPR * Math.min(2, Math.max(0.7, R / 40));
    for (let k = 0; k < seg; k++) {
      const s0 = a0 + c.len * k / seg, s1 = a0 + c.len * (k + 1) / seg, mid = (s0 + s1) / 2;
      const dop = 0.35 + 0.65 * (0.5 - 0.5 * Math.cos(mid - Math.PI) * -1);       // max à gauche (angle π)
      const fade = Math.sin(Math.PI * (k + 0.5) / seg);                          // bouts de l'arc qui s'effacent

  g = ctx.createRadialGradient(bx, by, 0, bx, by, R);

  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(bx, by); ctx.rotate(-0.035);
  const L = R * 4.8;
  for (const [w, a] of [[0.26, 0.10], [0.08, 0.45], [0.024, 1]]) {
    const lg = ctx.createLinearGradient(-L, 0, L, 0);
    lg.addColorStop(0, 'rgba(255,150,80,0)'); lg.addColorStop(0.22, warm(a * 0.55, 0.6)); lg.addColorStop(0.4, `rgba(255,250,240,${a})`);
    lg.addColorStop(0.56, warm(a * 0.85, 0.2)); lg.addColorStop(0.8, warm(a * 0.35, 0.9)); lg.addColorStop(1, 'rgba(255,140,70,0)');
    ctx.strokeStyle = lg; ctx.lineWidth = Math.max(0.8 * DPR, R * w); ctx.lineCap = 'round';

// ---------- 5. Orbites décoratives avec comètes (cercles à plat autour du trou noir) ----------
const orbits = [{ r: R_OUT + 60, sp: 0.00005, a0: 0.4 }, { r: R_OUT + 140, sp: -0.000035, a0: 2.2 }, { r: R_OUT + 240, sp: 0.000028, a0: 4.1 }, { r: R_OUT + 360, sp: -0.00002, a0: 5.2 }];
function drawOrbits(t) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (const o of orbits) {
    const head = o.a0 + t * o.sp, dir = Math.sign(o.sp), len = 0.9, N = 36;
    let px = null, py = null;
    for (let k = 0; k <= N; k++) {
      const a = head - dir * len * (k / N);
      project(Math.cos(a) * o.r, Math.sin(a) * o.r, tmp);
      if (px !== null) { ctx.strokeStyle = `rgba(255,255,255,${0.42 * (1 - k / N) ** 1.6})`; ctx.lineWidth = 1 * DPR; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(tmp[0], tmp[1]); ctx.stroke(); }
      px = tmp[0]; py = tmp[1];
    }
    project(Math.cos(head) * o.r, Math.sin(head) * o.r, tmp);
    const g = ctx.createRadialGradient(tmp[0], tmp[1], 0, tmp[0], tmp[1], 6 * DPR);
    g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(tmp[0] - 6 * DPR, tmp[1] - 6 * DPR, 12 * DPR, 12 * DPR);

}

// ---------- 6. Rendu d'une image ----------
let last = performance.now(), fpsAcc = 0, fpsN = 0, labelRects = [];
const vis = new Uint8Array(nodes.length);
const focus = new Uint8Array(nodes.length);
const filter = { kinds: new Set(), q: '' };
// PORT — signaux : ~70 petites traînées lumineuses qui courent le long des liens, de point en point
// (3 à 7 sauts), puis renaissent ailleurs. C'est ce qui fait « bouger » les connexions.
const signals = Array.from({ length: 70 }, () => newSignal());
function newSignal(from) {
  let a, e;
  if (from != null && nodeEdges[from].length) { e = nodeEdges[from][Math.floor(Math.random() * nodeEdges[from].length)]; a = from; }
  else { e = Math.floor(Math.random() * edges.length); a = edges[e][Math.random() < 0.5 ? 0 : 1]; }
  const b = edges[e][0] === a ? edges[e][1] : edges[e][0];
  return { a, b, t: Math.random() * (from == null ? 1 : 0), sp: 0.004 + Math.random() * 0.008, hops: 3 + Math.floor(Math.random() * 5) };
}

function frame(now) {
  const dt = Math.min(50, now - last); last = now; fpsAcc += dt; fpsN++;
  if (fpsAcc > 500) { document.getElementById('fps').textContent = `${nodes.length.toLocaleString('fr-FR')} souvenirs · ${Math.round(1000 * fpsN / fpsAcc)} i/s`; fpsAcc = 0; fpsN = 0; }
  // PORT — rotation lente de toute la mémoire autour de toi (un tour en ~15 min), arrêtée quand on zoome
  if (!paused && !dragging && cam.zoom < 1.6 && !fly) cam.rot += dt * 0.000007;
  if (grow < 1) grow = Math.min(1, grow + dt / 5000);
  if (fly) { const k = Math.min(1, (now - fly.t0) / fly.d), e = k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;
    for (const key of ['tx', 'ty', 'zoom']) cam[key] = fly.from[key] + (fly.to[key] - fly.from[key]) * e; if (k >= 1) fly = null; }

  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#040405'; ctx.fillRect(0, 0, W, H);
  if (neb) { const s = Math.max(W, H) * 1.5, ox = -cam.tx * 0.05 * scale() - (s - W) / 2, oy = -cam.ty * 0.05 * scale() - (s - H) / 2; ctx.globalAlpha = 0.45; ctx.drawImage(neb, ox, oy, s, s); ctx.globalAlpha = 1; }
  for (const s of stars) { ctx.fillStyle = `rgba(255,255,255,${s.a * 0.7})`; ctx.fillRect(s.x * W, s.y * H, s.r * DPR, s.r * DPR); }

  // PORT — chaque point flotte un peu autour de sa place (±1,6), donc les liens bougent doucement
  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const wx = Math.sin(now * 0.00045 + n.ph) * 1.6, wy = Math.cos(now * 0.0004 + n.ph * 1.3) * 1.6;
    project(n.x + wx, n.y + wy, tmp); P[i * 2] = tmp[0]; P[i * 2 + 1] = tmp[1];
    vis[i] = (filter.kinds.size === 0 || filter.kinds.has(n.kind)) && (grow >= 1 || n.kind === 'personne' || n.age >= MAX_AGE * (1 - grow)) ? 1 : 0;
  }
  drawOrbits(now);

  // PORT — liens : fins, blancs, en 3 groupes dont l'opacité respire chacun à son rythme (0,06 → 0,16)
  const base = Math.min(0.2, 0.11 + (cam.zoom - 1) * 0.025) * (sel >= 0 ? 0.3 : 1);
  ctx.lineWidth = 0.6 * DPR;
  for (let b = 0; b < 3; b++) {
    ctx.strokeStyle = `rgba(255,255,255,${base * (0.62 + 0.38 * Math.sin(now * 0.0011 + b * 2.1))})`; ctx.beginPath();
    for (let k = b; k < edges.length; k += 3) { const [a, c] = edges[k]; if (!vis[a] || !vis[c]) continue; ctx.moveTo(P[a * 2], P[a * 2 + 1]); ctx.lineTo(P[c * 2], P[c * 2 + 1]); }
    ctx.stroke();
  }
  // signaux
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  for (let k = 0; k < signals.length; k++) {
    let s = signals[k]; s.t += s.sp * dt / 16;
    if (s.t >= 1) { signals[k] = s.hops > 0 ? Object.assign(newSignal(s.b), { hops: s.hops - 1 }) : newSignal(); if (sel >= 0 && Math.random() < 0.35) signals[k] = newSignal(sel); continue; }
    if (!vis[s.a] || !vis[s.b]) continue;
    const ax = P[s.a * 2], ay = P[s.a * 2 + 1], bx = P[s.b * 2], by = P[s.b * 2 + 1];
    const t0 = Math.max(0, s.t - 0.3), x0 = ax + (bx - ax) * t0, y0 = ay + (by - ay) * t0, x1 = ax + (bx - ax) * s.t, y1 = ay + (by - ay) * s.t;
    const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(1, `rgba(255,255,255,${0.55 * Math.sin(Math.PI * Math.min(1, s.t * 1.2))})`);
    ctx.strokeStyle = g; ctx.lineWidth = 1 * DPR; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.restore();
  const lit = (i, a, w) => { ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = w * DPR; ctx.beginPath();
    for (const j of nodes[i].adj) if (vis[j]) { ctx.moveTo(P[i * 2], P[i * 2 + 1]); ctx.lineTo(P[j * 2], P[j * 2 + 1]); } ctx.stroke(); };
  if (sel >= 0) lit(sel, 0.8, 1);
  if (hover >= 0 && hover !== sel) lit(hover, 0.4, 0.8);

  drawPoints(now);
  const bh = drawBlackHole(now);

  // PORT — noms : de loin, seulement les amas (nom + nombre), du plus gros au plus petit, décalés ou
  // cachés s'ils se chevauchent ; de près, 18 titres au plus, jamais l'un sur l'autre.
  labelRects = [];
  ctx.textAlign = 'center';
  const taken = [];
  const free = (x, y, w, h) => { for (const r of taken) if (x < r[0] + r[2] && x + w > r[0] && y < r[1] + r[3] && y + h > r[1]) return false; taken.push([x, y, w, h]); return true; };
  taken.push([bh.bx - bh.R * 4.8, bh.by - bh.R * 1.7, bh.R * 9.6, bh.R * 3.6]);
  pillLabel(bh.bx, bh.by + bh.R * 1.85, 'Toi');
  const showGroups = inGroup < 0 || cam.zoom < 2.2;
  if (showGroups) [...groups.keys()].sort((a, b) => groups[b].ids.length - groups[a].ids.length).forEach(gi => {
    const g = groups[gi];
    project(g.cx, g.cy, tmp); const x = tmp[0]; let y = tmp[1];
    ctx.font = `600 ${12.5 * DPR}px -apple-system,system-ui,sans-serif`;
    const lw = Math.max(ctx.measureText(g.name).width, 70 * DPR) + 12 * DPR, lh = 32 * DPR;
    const ok = [0, -1, 1, -2, 2, -3, 3].some(k => { const yy = tmp[1] + k * 20 * DPR; if (free(x - lw / 2, yy - 14 * DPR, lw, lh)) { y = yy; return true; } return false; });
    if (!ok) return;
    ctx.globalAlpha = sel >= 0 ? 0.35 : (inGroup >= 0 && inGroup !== gi ? 0.4 : 1);
    ctx.fillStyle = '#ECEEF2'; ctx.fillText(g.name, x, y);
    ctx.font = `${10.5 * DPR}px -apple-system,system-ui,sans-serif`; ctx.fillStyle = 'rgba(200,204,210,.6)'; ctx.fillText(`${g.ids.length} souvenirs`, x, y + 14 * DPR);
    labelRects.push({ gi, x: x - lw / 2, y: y - 14 * DPR, w: lw, h: lh });
    ctx.globalAlpha = 1;
  });
  if (cam.zoom >= 2.2 || (inGroup >= 0 && cam.zoom >= 1.2)) {
    const cand = [];
    for (let i = 0; i < nodes.length; i++) { if (!vis[i] || nodes[i].kind !== 'conv' && nodes[i].kind !== 'personne') continue;
      if (inGroup >= 0 && nodes[i].g !== inGroup) continue;
      const x = P[i * 2], y = P[i * 2 + 1]; if (x < 0 || y < 0 || x > W || y > H) continue; cand.push([nodes[i].adj.length, i]); }
    cand.sort((a, b) => b[0] - a[0]);
    ctx.font = `500 ${11 * DPR}px -apple-system,system-ui,sans-serif`;
    let shown = 0;
    for (const [, i] of cand) { if (shown > 18) break;
      const x = P[i * 2], y = P[i * 2 + 1] - 9 * DPR, t = nodes[i].label, w = ctx.measureText(t).width + 8 * DPR;

  }

}
function pillLabel(x, y, t) {
  ctx.font = `600 ${11.5 * DPR}px -apple-system,system-ui,sans-serif`;
  const w = ctx.measureText(t).width + 18 * DPR, h = 22 * DPR;
  ctx.fillStyle = 'rgba(20,21,25,.85)'; ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = DPR;
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#F2F3F5'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y + DPR); ctx.textBaseline = 'alphabetic';
}
// PORT — points : discrets. Blanc cassé, opacité 0,4 → 0,8 selon les liens, qui scintille un peu ;
// petite croix de lumière (✦) seulement pour les plus reliés ; aucun gros halo.
function drawPoints(now) {
  for (let i = 0; i < nodes.length; i++) {
    if (!vis[i]) continue;
    const n = nodes[i], x = P[i * 2], y = P[i * 2 + 1];
    if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
    const deg = n.adj.length;
    let a = (n.kind === 'conv' || n.kind === 'personne' ? 0.5 + Math.min(0.4, deg * 0.045) : 0.35) * (0.82 + 0.18 * Math.sin(now * 0.002 + n.ph * 3));
    if (sel >= 0 && !focus[i]) a *= 0.15; else if (inGroup >= 0 && n.g !== inGroup) a *= 0.3;
    if (i === sel || i === hover) a = 1;
    const r = (n.kind === 'conv' || n.kind === 'personne' ? 0.75 + Math.min(0.85, deg * 0.08) : 0.55) * DPR * Math.pow(cam.zoom, 0.35);
    ctx.fillStyle = n.kind === 'personne' ? `rgba(255,220,180,${a})` : `rgba(236,238,243,${a})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
    if (deg >= 7 || i === sel) {
      ctx.strokeStyle = `rgba(255,255,255,${a * 0.35})`; ctx.lineWidth = 0.6 * DPR; const L = r * 4.5;
      ctx.beginPath(); ctx.moveTo(x - L, y); ctx.lineTo(x + L, y); ctx.moveTo(x, y - L); ctx.lineTo(x, y + L); ctx.stroke();
    }
    if (i === sel) { ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.1 * DPR; ctx.beginPath(); ctx.arc(x, y, r + 5 * DPR, 0, 6.283); ctx.stroke(); }
  }
}

// ---------- 7. Interactions ----------
let dragging = false, down = null;
function pick(mx, my) {
  let best = -1, bd = (10 * DPR) ** 2;
  for (let i = 0; i < nodes.length; i++) { if (!vis[i]) continue; const d = (P[i * 2] - mx) ** 2 + (P[i * 2 + 1] - my) ** 2; if (d < bd) { bd = d; best = i; } }
  return best;
}
function groupAt(mx, my) { for (const r of labelRects) if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return r.gi; return -1; }
// PORT — glisser = se déplacer ; molette / pincement = zoom vers le curseur ; double-clic = voler vers le point.
cv.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, m: 0 }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  const mx = e.clientX * DPR, my = e.clientY * DPR;
  if (down) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y; down.m += Math.abs(dx) + Math.abs(dy); down.x = e.clientX; down.y = e.clientY;
    if (down.m > 4) { dragging = true; cv.classList.add('drag'); fly = null; }
    if (dragging) { const k = scale(); cam.tx -= dx * DPR / k; cam.ty -= dy * DPR / k; }
    return;
  }
  const h = pick(mx, my); hover = h;
  const tip = document.getElementById('tip');
  if (h >= 0 && h !== sel) { tip.style.display = 'block'; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.textContent = nodes[h].label + ' · ' + KINDS[nodes[h].kind]; cv.style.cursor = 'pointer'; }
  else { tip.style.display = 'none'; cv.style.cursor = groupAt(mx, my) >= 0 ? 'pointer' : ''; }
});
cv.addEventListener('pointerup', e => {
  const wasDrag = dragging; dragging = false; cv.classList.remove('drag'); down = null;
  if (wasDrag) return;
  const mx = e.clientX * DPR, my = e.clientY * DPR;
  const gi = groupAt(mx, my); if (gi >= 0 && sel < 0) { enterGroup(gi); return; }
  select(pick(mx, my)); document.getElementById('tip').style.display = 'none';
});
cv.addEventListener('dblclick', e => { const i = pick(e.clientX * DPR, e.clientY * DPR); if (i >= 0) flyTo(nodes[i].x, nodes[i].y, 0, Math.max(cam.zoom, 5)); });
cv.addEventListener('pointerleave', () => { hover = -1; document.getElementById('tip').style.display = 'none'; });
cv.addEventListener('wheel', e => { e.preventDefault(); fly = null; zoomAt(e.clientX * DPR, e.clientY * DPR, Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0016))); }, { passive: false });

function zoomAt(mx, my, f) {
  const k0 = scale(), wx = (mx - W / 2) / k0 + cam.tx, wy = (my - H / 2) / k0 + cam.ty;
  cam.zoom = Math.max(0.35, Math.min(40, cam.zoom * f));
  const k1 = scale(); cam.tx = wx - (mx - W / 2) / k1; cam.ty = wy - (my - H / 2) / k1;
}
function flyTo(x, y, _z, zoom, d = 850) { const r = rot(x, y); fly = { t0: performance.now(), d, from: { ...cam }, to: { tx: r[0], ty: r[1], zoom } }; }
function enterGroup(gi) { inGroup = gi; const g = groups[gi]; flyTo(g.cx, g.cy, 0, Math.min(5, Math.max(1.6, 2.6 * Math.sqrt(N_ALL / g.count) * 0.55))); document.getElementById('back').style.display = 'block'; document.getElementById('brand').style.display = 'none'; }
function leaveGroup() { inGroup = -1; select(-1); fly = { t0: performance.now(), d: 850, from: { ...cam }, to: { tx: 0, ty: 0, zoom: 1 } }; document.getElementById('back').style.display = 'none'; document.getElementById('brand').style.display = 'block'; }

function select(i) {
  sel = i; focus.fill(0);
  if (i < 0) { closePanelDetail(); return; }
  focus[i] = 1; for (const j of nodes[i].adj) { focus[j] = 1; }
  showDetail(i);
}

// ---------- 8. Panneau de droite ----------
const panel = document.getElementById('panel'), pbody = document.getElementById('pbody');
let panelMode = 'list';
function openPanel() { panel.style.display = 'flex'; }
function closePanelDetail() { if (panelMode === 'detail') { panelMode = 'list'; panel.style.display = 'none'; } }
document.getElementById('pClose').onclick = () => { panel.style.display = 'none'; panelMode = 'list'; sel = -1; focus.fill(0); };
document.getElementById('pagesBtn').onclick = () => { panelMode = 'list'; openPanel(); renderList(); document.getElementById('q').focus(); };
const fmt = days => new Date(today - days * 86400000).toISOString().slice(0, 10);
function showDetail(i) {
  const n = nodes[i], g = groups[n.g]; panelMode = 'detail'; openPanel();
  const conv = n.kind === 'conv' ? n : (n.parent >= 0 ? nodes[n.parent] : null);
  const kids = n.kind === 'conv' ? n.adj.filter(j => nodes[j].parent === i) : [];
  const rel = n.adj.filter(j => nodes[j].kind === 'conv' || nodes[j].kind === 'personne').slice(0, 8);
  pbody.innerHTML = `
    <span class="tag">${KINDS[n.kind].toUpperCase()}${n.kind === 'conv' ? ' · ' + n.src.toUpperCase() : ''}</span>
    <h2></h2>
    <div class="meta">${g.name} · mis à jour le ${fmt(n.age)}</div>
    <button class="open">${n.kind === 'conv' ? (n.src === 'claude.ai' ? 'Ouvrir sur claude.ai ↗' : 'Reprendre la session ↗') : 'Voir la conversation'}</button>
    <p>${n.kind === 'conv'
      ? `Conversation du ${fmt(n.age)} dans <b>${g.name}</b>. ${kids.length} souvenir${kids.length > 1 ? 's' : ''} retenu${kids.length > 1 ? 's' : ''}, ${n.adj.length} lien${n.adj.length > 1 ? 's' : ''} vers d'autres conversations.`
      : n.kind === 'personne' ? `Apparaît dans ${n.adj.length} conversations de ${g.name}.` : `Retenu de « ${conv ? conv.label : '—'} ».`}</p>
    ${kids.length ? `<h4>Retenu</h4>` + kids.slice(0, 6).map(j => `<p style="margin:6px 0"><span class="tag" style="margin:0 6px 0 0">${KINDS[nodes[j].kind]}</span>${nodes[j].label}</p>`).join('') : ''}
    <h4>Relié à</h4>
    <p>${rel.map(j => `<span class="link" data-j="${j}"></span>`).join(', ') || '—'}</p>`;
  pbody.querySelector('h2').textContent = n.label;
  pbody.querySelectorAll('.link').forEach(el => { const j = +el.dataset.j; el.textContent = nodes[j].label; el.onclick = () => { flyTo(nodes[j].x, nodes[j].y, nodes[j].z, Math.max(cam.zoom, 4)); select(j); }; });
  pbody.scrollTop = 0;
}
function renderList() {
  const q = filter.q.toLowerCase();
  const list = nodes.filter(n => (filter.kinds.size === 0 || filter.kinds.has(n.kind)) && (!q || n.label.toLowerCase().includes(q) || groups[n.g].name.toLowerCase().includes(q)))
    .sort((a, b) => a.age - b.age).slice(0, 60);
  pbody.innerHTML = list.map(n => `<button class="res" data-i="${n.id}"></button>`).join('') || '<p>Rien trouvé.</p>';
  pbody.querySelectorAll('.res').forEach(el => { const n = nodes[+el.dataset.i]; el.textContent = n.label; const s = document.createElement('small'); s.textContent = `${KINDS[n.kind]} · ${groups[n.g].name} · ${fmt(n.age)}`; el.appendChild(s);
    el.onclick = () => { flyTo(n.x, n.y, n.z, Math.max(cam.zoom, 5)); select(n.id); }; });
}
const chips = document.getElementById('chips');
Object.entries(KINDS).forEach(([k, l]) => { const b = document.createElement('button'); b.textContent = l + (k === 'personne' ? 's' : 's'); b.onclick = () => { filter.kinds.has(k) ? filter.kinds.delete(k) : filter.kinds.add(k); b.classList.toggle('on'); renderList(); }; chips.appendChild(b); });
document.getElementById('q').oninput = e => { filter.q = e.target.value; panelMode = 'list'; renderList(); };

// ---------- 9. Accueil : tableau de bord ----------
const dash = document.getElementById('dash');
function openDash() {
  const convs = nodes.filter(n => n.kind === 'conv'), els = nodes.filter(n => n.kind !== 'conv' && n.kind !== 'personne');
  const week = nodes.filter(n => n.age < 7).length;
  const hist = (arr, buckets, span) => { const h = Array(buckets).fill(0); arr.forEach(n => { const b = buckets - 1 - Math.floor(n.age / span); if (b >= 0) h[b]++; }); return h; };
  const bars = (h, c) => { const m = Math.max(...h, 1); return `<div class="bars">${h.map(v => `<i style="height:${Math.max(4, v / m * 100)}%;background:${c};opacity:${0.35 + 0.65 * v / m}"></i>`).join('')}</div>`; };
  const card = (n, l, s, c, h, badge) => `<div class="card" style="box-shadow:inset 3px 0 0 ${c}"><span class="badge" style="color:${c};border-color:${c}55">${badge}</span><div class="n">${n.toLocaleString('fr-FR')}</div><div class="l">${l}</div><div class="s">${s}</div>${bars(h, c)}</div>`;
  const days = hist(nodes, 30, 1);
  const byG = groups.map((g, gi) => [g, gi]).sort((a, b) => b[0].ids.length - a[0].ids.length);
  const maxG = byG[0][0].ids.length;
  const top = [...convs].sort((a, b) => b.adj.length - a.adj.length).slice(0, 6);
  const recent = [...convs].sort((a, b) => a.age - b.age).slice(0, 4);
  dash.innerHTML = `
    <div class="top"><h3>Accueil</h3><span class="date">${fmt(0)}</span><span style="flex:1"></span><button class="x" id="dClose" aria-label="Fermer">×</button></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-4-4"/></svg><input id="dq" placeholder="Chercher dans toutes tes conversations et souvenirs…"></label>
    <div class="cards">
      ${card(convs.length, 'Conversations', 'claude.ai et Claude Code', '#FB923C', hist(convs, 8, 50), '+' + convs.filter(n => n.age < 7).length + ' cette semaine')}
      ${card(els.length, 'Souvenirs', 'décisions, leçons, faits, préférences', '#34D399', hist(els, 8, 50), (els.length / convs.length).toFixed(1) + ' / conv.')}
      ${card(edges.length, 'Liens', 'entre conversations et souvenirs', '#60A5FA', hist(convs, 8, 50).map(v => v * 3), (edges.length / nodes.length).toFixed(1) + ' / point')}
      ${card(week, 'Cette semaine', 'nouveaux ces 7 derniers jours', '#A78BFA', hist(nodes.filter(n => n.age < 56), 8, 7), Math.round(week / nodes.length * 100) + ' %')}
    </div>
    <div class="row3">
      <div class="box"><h5>Activité</h5><div class="sub">Par jour, 30 derniers jours</div><div class="chart">${days.map(v => `<i style="height:${v / Math.max(...days, 1) * 100}%"></i>`).join('')}</div></div>
      <div class="box"><h5>Souvenirs par projet</h5><div class="sub">Clique pour y aller</div>${byG.slice(0, 7).map(([g, gi]) => `<button class="hbar" data-g="${gi}">${g.name}<span>${g.ids.length}</span><i style="width:${g.ids.length / maxG * 100}%;background:#34D399"></i></button>`).join('')}</div>
      <div class="box"><h5>Les plus reliées</h5><div class="sub">Conversations avec le plus de liens</div>${top.map(n => `<button class="hbar" data-n="${n.id}"></button>`).join('')}</div>
    </div>
    <div class="row2">
      <div class="box"><div class="lab">ACTIVITÉ RÉCENTE</div>${recent.map(n => `<button class="res" data-n="${n.id}"></button>`).join('')}</div>
      <div class="box"><div class="lab">DERNIERS SOUVENIRS RETENUS</div>${[...els].sort((a, b) => a.age - b.age).slice(0, 4).map(n => `<button class="res" data-n="${n.id}"></button>`).join('')}</div>
    </div>`;
  dash.querySelectorAll('[data-n]').forEach(el => { const n = nodes[+el.dataset.n]; el.textContent = n.label;
    const s = document.createElement(el.classList.contains('hbar') ? 'span' : 'small'); s.textContent = el.classList.contains('hbar') ? n.adj.length : `${KINDS[n.kind]} · ${groups[n.g].name} · ${fmt(n.age)}`; el.appendChild(s);
    if (el.classList.contains('hbar')) { const i = document.createElement('i'); i.style.cssText = `width:${n.adj.length / top[0].adj.length * 100}%;background:#60A5FA`; el.appendChild(i); }
    el.onclick = () => { dash.style.display = 'none'; flyTo(n.x, n.y, n.z, 5); select(n.id); }; });
  dash.querySelectorAll('[data-g]').forEach(el => el.onclick = () => { dash.style.display = 'none'; enterGroup(+el.dataset.g); });
  dash.querySelector('#dClose').onclick = () => dash.style.display = 'none';
  dash.querySelector('#dq').oninput = e => { dash.style.display = 'none'; filter.q = e.target.value; panelMode = 'list'; openPanel(); document.getElementById('q').value = e.target.value; renderList(); document.getElementById('q').focus(); };
  dash.style.display = 'block';
}
document.getElementById('home').onclick = () => dash.style.display === 'block' ? dash.style.display = 'none' : openDash();

// ---------- 10. Contrôles ----------
document.getElementById('zIn').onclick = () => zoomAt(W / 2, H / 2, 1.5);
document.getElementById('zOut').onclick = () => zoomAt(W / 2, H / 2, 1 / 1.5);
document.getElementById('reset').onclick = () => leaveGroup();
document.getElementById('grow').onclick = () => { leaveGroup(); grow = 0; };
document.getElementById('pause').onclick = () => paused = !paused;
document.getElementById('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
document.getElementById('back').onclick = () => leaveGroup();

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
