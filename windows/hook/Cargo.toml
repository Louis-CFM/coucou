[package]
name = "coucou-hook"
description = "Relays Claude Code hook events to Coucou over a named pipe (Windows) or a Unix socket (Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "coucou-hook"
path = "src/main.rs"

[[test]]
name = "auto_launch_process"
path = "tests/auto_launch_process.rs"
harness = false

[[test]]
name = "auto_launch_relay"
path = "tests/auto_launch_relay.rs"
harness = false

[dependencies]
serde_json = "1"

# Just enough Win32 to know our own SID and to check who is serving the pipe.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Storage_FileSystem", "Win32_System_IO"] }

# The socket syscalls and peer credentials the Linux transport needs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
