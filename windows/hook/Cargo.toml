[package]
name = "alfred-hook"
description = "Relays Claude Code hook events to Alfred over a named pipe"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "alfred-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# Just enough Win32 to know our own SID and to check who is serving the pipe.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
