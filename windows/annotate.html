<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annotate</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #f5f6f8;
        font: 13px system-ui, "Segoe UI Variable Text", "Segoe UI", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #bar {
        height: 56px;
        flex: 0 0 56px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
      }
      #bar button {
        border: 0;
        border-radius: 7px;
        height: 28px;
        padding: 0 12px;
        color: #f5f6f8;
        background: rgba(255, 255, 255, 0.06);
        font: 600 13px inherit;
        cursor: pointer;
      }
      #bar button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #bar button.tool {
        width: 32px;
        padding: 0;
        font-size: 15px;
      }
      #bar button.tool.on {
        background: rgba(255, 255, 255, 0.18);
      }
      #bar button.swatch {
        width: 16px;
        height: 16px;
        padding: 0;
        border-radius: 50%;
        box-shadow: 0 0 0 2px transparent;
      }
      #bar button.swatch.on {
        box-shadow: 0 0 0 2px #000, 0 0 0 4px rgba(255, 255, 255, 0.9);
      }
      #bar button.primary {
        background: #fb923c;
        color: #000;
      }
      #bar .sep {
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.16);
      }
      #stage {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        place-items: center;
        padding: 0 12px 12px;
      }
      #canvas {
        cursor: crosshair;
        touch-action: none;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <script type="module" src="/src/annotate/main.ts"></script>
  </body>
</html>
