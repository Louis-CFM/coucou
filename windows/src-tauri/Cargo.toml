[package]
name = "coucou"
description = "Coucou for Windows and Linux — Mochi lives at the top of your screen"
authors = ["Louis Raille"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coucou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Phone link (phone_link/): a TLS server for the Android app, off unless the user
# turns it on. Every crate here is justified in docs/ANDROID_LINK.md.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# The phone finds this computer by itself when its address changes: it is announced on the local network
# (mDNS / DNS-SD, `_coucou._tcp`) only while the phone link is on (phone_link/discovery.rs). Pure Rust,
# Apache-2.0 OR MIT, no async runtime or logger (default features off); it adds five small crates
# (mdns-sd, flume, if-addrs, socket-pktinfo, spin). See docs/ANDROID_LINK.md.
mdns-sd = { version = "0.21", default-features = false }
# Phone link through a relay (phone_link/relay_client.rs; docs/RELAY_LINK.md): the computer opens an outbound
# WebSocket to the user's own relay, only while "Away from home Wi-Fi" is on. tokio-tungstenite is the WebSocket
# framing only (no TLS feature: the TLS is the tokio-rustls/ring already here, with the web roots reqwest already
# pulls in), so no second crypto provider is added. MIT.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
webpki-roots = "1"
# Stream/Sink traits for the WebSocket (already in the tree through tokio-tungstenite and tauri).
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The island's file drop reads paths straight from WebView2 (webview_drop.rs).
# Same versions as wry, so nothing new is compiled.
webview2-com = "0.39"
wv2_core = { package = "windows-core", version = "0.62" }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  # "Open terminal": the relay's process tree leads to the session's window.
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring, KWallet) over D-Bus, encrypted in transit.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
# The GTK that Tauri already runs on, to reach its window for layer-shell and
# the input region. libgtk-layer-shell itself is called directly (platform/linux.rs).
gtk = "0.18"
# libdbus, which keyring's Secret Service already links, so nothing new is
# downloaded: Wayland global shortcuts through the XDG GlobalShortcuts portal
# (portal.rs), the Spotify pill over MPRIS (spotify.rs) and "Open terminal"
# through KWin's scripting (platform/linux_focus.rs).
dbus = "0.9.12"
# EWMH on X11 for "Open terminal", already in the tree (global-hotkey).
x11rb = { version = "0.13", default-features = false }
