[workspace]
members = ["src-tauri", "hook"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

# Release profile shared by the app and the hook relay: the hook must start fast
# (Claude Code spawns it on every event), so we optimise for size and speed.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Dev builds: this app pulls in tauri, reqwest, rustls and the Windows/GTK bindings, so
# compile time and link time dominate the edit-run loop, not the speed of our own code.
[profile.dev]
# File names and line numbers in backtraces, without the full DWARF of every crate.
debug = "line-tables-only"

# Dependencies change rarely and run hot (TLS, JSON, the pipe server): a light
# optimisation makes the app feel like the real one and costs one build per Cargo.lock change.
[profile.dev.package."*"]
opt-level = 1
