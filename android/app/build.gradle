import java.util.zip.ZipFile

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingValue(String name) {
    def v = System.getenv(name) ?: (project.hasProperty(name) ? project.property(name) : null)
    return (v != null && !v.toString().trim().isEmpty()) ? v.toString() : null
}

def localKeystore = file("release.keystore").exists() ? file("release.keystore") : null
def releaseKeystore = signingValue("COUCOU_KEYSTORE_FILE") ?: (localKeystore != null ? localKeystore.absolutePath : null)
def releaseStorePassword = signingValue("COUCOU_KEYSTORE_PASSWORD") ?: (localKeystore != null ? "coucou123" : null)
def releaseKeyAlias = signingValue("COUCOU_KEY_ALIAS") ?: (localKeystore != null ? "coucou" : null)
def releaseKeyPassword = signingValue("COUCOU_KEY_PASSWORD") ?: releaseStorePassword

android {
    namespace 'com.coucou.android'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.coucou.android'
        minSdk 30
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
        resourceConfigurations += ['en', 'fr', 'es', 'pt-rBR', 'b+zh+Hans', 'hi', 'bn', 'ru', 'in', 'ar', 'tr', 'de', 'ja', 'ko', 'b+zh+Hant', 'th', 'it']
    }

    signingConfigs {
        if (releaseKeystore != null && releaseStorePassword != null && releaseKeyAlias != null) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        debug.java.srcDirs += 'src/debug/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'

    def cameraX = '1.3.4'
    implementation "androidx.camera:camera-core:$cameraX"
    implementation "androidx.camera:camera-camera2:$cameraX"
    implementation "androidx.camera:camera-lifecycle:$cameraX"
    implementation "androidx.camera:camera-view:$cameraX"
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

tasks.register('verifyReleaseNoLogs') {
    group = 'verification'
    description = 'Builds the release APK and fails if a debug log tag or message is still in it.'
    dependsOn 'assembleRelease'
    def apkDir = layout.buildDirectory.dir('outputs/apk/release')
    doLast {
        def apks = apkDir.get().asFile.listFiles()?.findAll { it.name.endsWith('.apk') } ?: []
        if (apks.size() != 1) {
            throw new GradleException("expected one release APK, found ${apks.size()}")
        }
        def leftovers = ['CoucouOverlay', 'CoucouLaunch', 'CoucouDiscovery', 'CoucouIsland', 'island failed', 'cannot browse', 'ignored an early tap']
        def zip = new ZipFile(apks[0])
        try {
            for (entry in zip.entries()) {
                if (entry.name.endsWith('.dex')) {
                    def text = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
                    for (word in leftovers) {
                        if (text.contains(word)) {
                            throw new GradleException("'$word' is still in ${entry.name}: the debug logs were not stripped")
                        }
                    }
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.matching { it.name == 'lint' }.configureEach {
    dependsOn 'verifyReleaseNoLogs'
}
