name: Windows CI

# Type-checks and tests the Windows app on every pull request that touches it.
# Nothing is packed and nothing is published: releases stay in windows.yml,
# which only runs on tags.

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tests run the TypeScript sources directly, which needs Node 22.18
      # or newer; 24 is the version they are run with locally.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      # Caches the registry and the dependencies only, keyed on Cargo.lock and the compiler,
      # and drops our own crates' artefacts, which change on every push.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Island tests
        run: npm test

      # The app bundles target/release/coucou-hook.exe as a resource, and its
      # build script refuses to run until that file exists. One command per
      # step: PowerShell carries on after a failed command in the same step.
      - name: Build the relay
        run: cargo build --release -p coucou-hook

      - name: Rust tests
        run: cargo test --workspace --locked

      # Warnings are reported, not fatal: the existing code has a few to clean up first.
      # Once it is clean, add `-- -D warnings` here.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
