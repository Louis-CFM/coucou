name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen

      - name: Unit tests
        run: |
          for t in scripts/test-*.sh; do
            echo "== $t"
            bash "$t"
          done

      - name: Build
        run: cd NotchBuddy && xcodebuild -scheme NotchBuddy -configuration Debug build
