name: Phone link

# Checks for the phone link (windows/src-tauri/src/phone_link):
# the desktop tests on Windows. Builds nothing that is published and uploads
# no artifact. (The upstream Kotlin interop job was dropped together with the
# upstream Android app — this fork keeps its own companion.)

on:
  pull_request:
    paths:
      - 'windows/src-tauri/src/phone_link/**'
      - 'docs/ANDROID_LINK.md'
      - '.github/workflows/phone-link.yml'
  push:
    branches: [main]
    paths:
      - 'windows/src-tauri/src/phone_link/**'
      - 'docs/ANDROID_LINK.md'
      - 'docs/RELAY_LINK.md'
      - '.github/workflows/phone-link.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: windows/package-lock.json }
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: phone-link-win-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: phone-link-win-
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: cargo build --release -p coucou-hook
      - run: cargo test --workspace --locked

