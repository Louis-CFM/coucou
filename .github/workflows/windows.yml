name: Nova Windows
on:
  workflow_dispatch:
  push:
    branches: [main, nova/assistant-upgrade]
    paths: ['windows/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: nova-windows-${{ hashFiles('windows/Cargo.lock') }}
      - run: npm ci
      - run: npm run icons
      - name: Fetch verified native OpenCode engine
        run: npm run engine
      - name: Frontend regression tests
        shell: pwsh
        run: |
          $output = & node --import ./tests/setup.mjs --test --test-reporter=tap "tests/**/*.test.mjs" 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            foreach ($failure in ($output | Select-String -Pattern '^not ok ' -Context 0,35)) {
              $text = $failure.ToString()
              if ($text.Length -gt 3800) { $text = $text.Substring(0,3800) }
              $text = $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Frontend regression failure::$text"
            }
            exit $code
          }
      - run: npm exec tsc -- --noEmit
      - run: cargo build --release -p nova-hook
      - name: Native tests and real-engine approval integration
        shell: pwsh
        env:
          NOVA_ENGINE_TEST_EXE: ${{ github.workspace }}\windows\engine\opencode.exe
        run: |
          $output = & cargo test --workspace 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ($code -ne 0) {
            $tail = ($output | Select-Object -Last 30) -join "`n"
            $tail = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Native build or integration failure::$tail"
            exit $code
          }
      - run: npm run pack
      - name: Windows process launch smoke test (not visual acceptance)
        working-directory: .
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'Nova-smoke-roaming'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'Nova-smoke-local'
          New-Item -ItemType Directory -Force $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $process = Start-Process -FilePath (Resolve-Path windows/target/release/nova.exe) -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "Nova exited during launch smoke test: $($process.ExitCode)" }
            Write-Output "Nova process remained alive for 8 seconds; visual/DPI acceptance still requires a real desktop."
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { taskkill /PID $process.Id /T /F | Out-Null }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-Windows-assistant-upgrade-installer
          path: windows/release/Nova-Windows-setup.exe
          if-no-files-found: error
      - name: Prepare portable directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/engine | Out-Null
          Copy-Item target/release/nova.exe,target/release/nova-hook.exe portable/
          Copy-Item engine/opencode.exe,engine/LICENSE.txt,engine/VERSION portable/engine/
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-Windows-assistant-upgrade-portable
          path: windows/portable/
          if-no-files-found: error
