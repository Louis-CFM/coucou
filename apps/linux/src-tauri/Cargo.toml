[package]
name = "linux"
version = "0.1.0"
description = "Coucou — Linux companion"
authors = ["Louis Raille"]
edition = "2021"

[lib]
name = "linux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
base64 = "0.22"
secret-service = { version = "4", optional = true }
tauri-plugin-global-shortcut = "2"

[features]
default = ["secret-service"]
secret-service = ["dep:secret-service"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
